name: Testar sites
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper/testar_sites.py
      - run: |
          git config user.name "radar-casas"
          git config user.email "radar-casas@users.noreply.github.com"
          git add debug
          git commit -m "Teste de sites" || exit 0
          git pull --rebase origin main
          git push
