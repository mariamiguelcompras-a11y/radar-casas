name: Analisar links adicionados

on:
  workflow_dispatch: {}
  push:
    paths: ["data/links-manuais.json"]   # corre sozinho quando a lista de links muda

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analisar os links
        run: python scraper/so_links.py
      - name: Guardar resultados
        run: |
          git config user.name "radar-casas"
          git config user.email "radar-casas@users.noreply.github.com"
          git add data/imoveis.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Links adicionados no radar ($(date +%F))"
            git pull --rebase origin main
            git push
          fi
